<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fermentum — laboratorio de fermentación</title>
    <!-- La descripcion y las etiquetas Open Graph son para el enlace de
         invitacion: se comparte por chat, y sin ellas se pega como una URL
         desnuda. El theme-color es --mesa, el suelo de la mesa de juego. -->
    <meta
      name="description"
      content="Eurogame de gestión de recursos y construcción de motores para 1–4 investigadores. Cultiva tu masa madre, hornea en el momento justo y acumula Puntos de Maestría."
    />
    <meta name="theme-color" content="#100d0b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fermentum" />
    <meta
      property="og:description"
      content="Cultiva. Fermenta. Hornea a tiempo. Partida online para 1–4 investigadores."
    />
    <!-- Bricolage Grotesque = titulos (la mitad panadera: formas algo
         irregulares, casi cortadas a mano). IBM Plex Sans/Mono = cuerpo y
         numeros (la mitad de laboratorio). Una sola peticion para las tres. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
