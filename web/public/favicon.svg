<!--
  Marca de Fermentum: una hogaza con los cortes cruzados, sobre el fondo de la
  mesa (--mesa, #100d0b). Dibujada a mano como todos los Icono*.vue, con la
  misma paleta que IconoPan.vue usa para el Pan de Campo -- este repo no tiene
  binarios ni cadena de assets, y el favicon que habia era un rayo morado
  generico exportado de Figma, sin ninguna relacion con el juego.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#100d0b"/>
  <ellipse cx="16" cy="18.5" rx="11" ry="9" fill="#c9974f" stroke="#7a4f22" stroke-width="1.1"/>
  <path
    d="M8.5 13.5 L12.5 9.5 M14 12.5 L18 8.5 M19.5 13.5 L23.5 9.5"
    stroke="#7a4f22"
    stroke-width="1.7"
    fill="none"
    stroke-linecap="round"
  />
</svg>
