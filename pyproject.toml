[project]
name = "fermentum-sim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Core simulation (models.py/engine.py/actions.py/main.py) stays dependency-free.
# The optional server/ package (Milestone 3+) needs its own deps, listed separately
# so a CLI-only checkout never has to install a web framework.
dev = ["pytest>=8", "httpx>=0.27"]
server = ["starlette>=0.37", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
